function card(p){let el=document.createElement('div');el.className='tile';el.draggable=true;el.dataset.id=p[0];el.title=p[1];let art=document.createElement('div');art.className='portrait';if(images[p[0]]){let img=new Image();img.crossOrigin='anonymous';img.src=images[p[0]];img.alt=p[1];img.onerror=()=>{art.textContent=p[1][0]};art.append(img)}else{art.textContent=p[1][0]}let band=document.createElement('div');band.className='name';let s=document.createElement('span');s.textContent=p[1];band.append(s);el.append(art,band);el.onclick=()=>{chosen=p[0];$('status').textContent=p[1]+' を選択。移動先の空白をタップしてください'};el.ondragstart=e=>{dragged=p[0];e.dataTransfer.setData('text/plain',p[0])};return el}

async function loadImages(){
let loaded=0,failed=0;
const overrides={wilhelm2:'ヴィルヘルム2世 (ドイツ皇帝)',nicholas2:'ニコライ2世 (ロシア皇帝)',park:'朴正煕',hirota:'広田弘毅',konoe:'近衛文麿',trump:'ドナルド・トランプ',sunak:'孫文',putin2:'ボリス・エリツィン',suharto2:'マハティール・ビン・モハマド'};
for(let i=0;i<people.length;i+=10){
const group=people.slice(i,i+10);
try{
const titles=group.map(p=>p[2]);
const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&pithumbsize=360&titles='+encodeURIComponent(titles.join('|'));
const data=await (await fetch(u)).json();
const pages=Object.values(data.query?.pages||{});
const redirects=new Map((data.query?.redirects||[]).map(x=>[x.from.toLowerCase(),x.to.toLowerCase()]));
const normalized=new Map((data.query?.normalized||[]).map(x=>[x.from.toLowerCase(),x.to.toLowerCase()]));
for(const p of group){
let name=p[2].toLowerCase();name=normalized.get(name)||name;name=redirects.get(name)||name;
const pg=pages.find(v=>v.title.toLowerCase()===name);
if(pg?.thumbnail?.source){images[p[0]]=pg.thumbnail.source;loaded++}
else failed++;
}
}catch(e){failed+=group.length}
$('status').textContent='肖像取得: '+loaded+'件 / '+people.length+'人（未取得 '+failed+'件）';
render();
}
const missing=people.filter(p=>!images[p[0]]);
for(let i=0;i<missing.length;i+=10){
const group=missing.slice(i,i+10);
try{
const titles=group.map(p=>overrides[p[0]]||p[1]);
const u='https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&pithumbsize=360&titles='+encodeURIComponent(titles.join('|'));
const data=await (await fetch(u)).json();
const pages=Object.values(data.query?.pages||{});
const redirect=new Map([...(data.query?.redirects||[]),...(data.query?.normalized||[])].map(x=>[x.from,x.to]));
for(const p of group){let title=overrides[p[0]]||p[1];title=redirect.get(title)||title;const pg=pages.find(v=>v.title===title);if(pg?.thumbnail?.source){images[p[0]]=pg.thumbnail.source;loaded++}}
}catch(e){}
render();
}
$('status').textContent='肖像取得完了: '+loaded+' / '+people.length+'人。未取得の人物は頭文字を表示します。';
}
function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}

async function exportXImages(){
const W=1920,H=1080,LEFT=145,PAD=14,GAP=7,TOP=100,BOTTOM=36;
$('status').textContent='X投稿用画像を生成しています…';
for(let page=0;page<2;page++){
const selected=page===0?ranks.slice(0,3):ranks.slice(3,6);
const sections=selected.map(([rank,color,description])=>({rank,color,description,members:people.filter(p=>positions[p[0]]===rank)}));
const maxCount=Math.max(...sections.map(x=>x.members.length),1);
let tileW=132,columns=Math.floor((W-LEFT-PAD*2+GAP)/(tileW+GAP));
let required=sections.reduce((sum,x)=>sum+Math.max(1,Math.ceil(x.members.length/columns)),0);
let tileH=Math.floor((H-TOP-BOTTOM-3*GAP*2)/required);
while(tileH<115&&tileW>90){tileW-=4;columns=Math.floor((W-LEFT-PAD*2+GAP)/(tileW+GAP));required=sections.reduce((sum,x)=>sum+Math.max(1,Math.ceil(x.members.length/columns)),0);tileH=Math.floor((H-TOP-BOTTOM-3*GAP*2)/required)}
tileH=Math.min(168,tileH);
const units=sections.map(x=>Math.max(1,Math.ceil(x.members.length/columns)));
const free=H-TOP-BOTTOM-3*GAP*2-units.reduce((a,b)=>a+b*tileH,0);
const extra=Math.floor(Math.max(0,free)/3);
const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
const g=canvas.getContext('2d');g.fillStyle='#10151f';g.fillRect(0,0,W,H);
g.fillStyle='#f4f7ff';g.font='bold 42px sans-serif';g.fillText('1900年以降の指導者 Tier表',24,58);
g.font='24px sans-serif';g.fillStyle='#b7c4d5';g.fillText(page===0?'1 / 2  ·  S〜B':'2 / 2  ·  C〜E',W-240,58);
let y=TOP;
for(let si=0;si<sections.length;si++){
const sec=sections[si],rows=units[si],height=rows*tileH+extra+GAP*2;
g.fillStyle=sec.color;g.fillRect(0,y,LEFT,height);
g.fillStyle='#10151f';g.textAlign='center';g.font='bold 51px sans-serif';g.fillText(sec.rank,LEFT/2,y+height/2-3);
g.font='bold 17px sans-serif';g.fillText(sec.description,LEFT/2,y+height/2+26);g.textAlign='left';
g.fillStyle='#192436';g.fillRect(LEFT,y,W-LEFT,height);
for(let i=0;i<sec.members.length;i++){
const p=sec.members[i],x=LEFT+PAD+(i%columns)*(tileW+GAP),yy=y+GAP+Math.floor(i/columns)*tileH;
const h=tileH-GAP,band=Math.max(24,Math.min(32,Math.round(h*.23))),photoH=h-band;
g.fillStyle='#354359';g.fillRect(x,yy,tileW,h);
if(images[p[0]]){
try{
const im=new Image();im.crossOrigin='anonymous';im.src=images[p[0]];await im.decode();
const scale=Math.max(tileW/im.naturalWidth,photoH/im.naturalHeight);
const iw=im.naturalWidth*scale,ih=im.naturalHeight*scale;
g.save();g.beginPath();g.rect(x,yy,tileW,photoH);g.clip();g.drawImage(im,x+(tileW-iw)/2,yy,iw,ih);g.restore();
}catch(e){g.fillStyle='#ffffff';g.font='bold 28px sans-serif';g.fillText(p[1].slice(0,1),x+tileW/2-14,yy+photoH/2)}
}else{g.fillStyle='#ffffff';g.font='bold 28px sans-serif';g.fillText(p[1].slice(0,1),x+tileW/2-14,yy+photoH/2)}
g.fillStyle='#081320';g.fillRect(x,yy+photoH,tileW,band);
g.fillStyle='#ffffff';g.font='bold 17px sans-serif';
