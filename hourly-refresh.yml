name: Hourly post metrics refresh (experimental)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update known post metrics (opt-in)
        env:
          SATO_ENABLE_UNOFFICIAL_REFRESH: ${{ vars.SATO_ENABLE_UNOFFICIAL_REFRESH }}
        run: python scripts/refresh.py
      - name: Commit changes if any
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data.json
            git commit -m 'Refresh known post metrics'
            git push
          else
            echo 'No data changes'
          fi
