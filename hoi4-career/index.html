<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoI4 キャリアプロフィール一覧</title>
<style>:root{color-scheme:dark}body{margin:0;background:#0b1220;color:#e7edf8;font:15px system-ui,"Noto Sans JP",sans-serif}main{max-width:1050px;margin:auto;padding:32px 18px}h1{font-size:27px}p{color:#aebbd0;line-height:1.7}.panel{background:#172337;border:1px solid #33435d;border-radius:14px;padding:20px;margin:18px 0}button,input,select{background:#263955;color:white;border:1px solid #526682;border-radius:7px;padding:10px;font:inherit}button{cursor:pointer}input[type=file]{max-width:100%;box-sizing:border-box}input[type=search]{width:min(340px,90%)}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #33435d;text-align:left}th{color:#b8c9e1}td:nth-child(1),td:nth-child(3){font-variant-numeric:tabular-nums}small{color:#aebbd0}a{color:#8bbcff}.status{color:#a8d6ff}.warn{color:#ffd38b}</style></head>
<body><main><p><a href="./">← X分析サイトに戻る</a></p><h1>🎖️ HoI4 キャリアプロフィール一覧</h1>
<p>Hearts of Iron IV のキャリアプロフィール（.pr）から国家タグを読み取り、一覧表示します。ブラウザ内で処理するため、ファイルはサーバーへ送信されません。</p>
<section class="panel"><label for="file">キャリアプロフィールを選択</label><div class="controls"><input id="file" type="file" accept=".pr,.bin,application/octet-stream"></div><div id="status" class="status">ファイルを選択してください。</div><p class="warn"><strong>現段階の制限：</strong>表示する「記録数」はファイル内の国家タグ付きエントリ数です。プレイ回数・勝利数などのゲーム内統計ではありません。自動更新には別途PC側の同期プログラムが必要です。</p></section>
<section class="panel"><div class="controls"><input id="search" type="search" placeholder="国家タグを検索（GER、JAPなど）"><select id="sort"><option value="count">記録数が多い順</option><option value="tag">国家タグ順</option></select><button id="csv">CSVを保存</button><button id="copy">表をコピー</button></div><p id="summary">データ未読込</p><table><thead><tr><th>順位</th><th>国家タグ</th><th>記録数（統計ではありません）</th></tr></thead><tbody id="rows"></tbody></table></section>
</main><script>
const $=id=>document.getElementById(id);let records=[];
function parse(bytes){const counts=new Map();let total=0;for(let i=0;i+11<=bytes.length;i++){if(bytes[i]!==2||bytes[i+1]!==42||bytes[i+2]!==1||bytes[i+3]!==0||bytes[i+4]!==15||bytes[i+5]!==0||bytes[i+6]!==3||bytes[i+7]!==0)continue;const a=bytes[i+8],b=bytes[i+9],c=bytes[i+10];if(![a,b,c].every(n=>n>=65&&n<=90))continue;const tag=String.fromCharCode(a,b,c);counts.set(tag,(counts.get(tag)||0)+1);total++;i+=10;}return {counts,total};}
function visible(){let q=$('search').value.trim().toUpperCase();let a=records.filter(x=>x.tag.includes(q));if($('sort').value==='tag')a.sort((x,y)=>x.tag.localeCompare(y.tag));else a.sort((x,y)=>y.count-x.count||x.tag.localeCompare(y.tag));return a;}
function render(){const a=visible();$('rows').replaceChildren(...a.map((r,i)=>{const tr=document.createElement('tr');[i+1,r.tag,r.count].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});return tr;}));$('summary').textContent=records.length? '表示：'+a.length+'国家タグ / 検出：'+records.length+'種類':'データ未読込';}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const b=new Uint8Array(await f.arrayBuffer());const {counts,total}=parse(b);records=[...counts].map(([tag,count])=>({tag,count}));$('status').textContent=f.name+'：'+total+'件の国家タグ付き記録、'+counts.size+'種類の国家タグを検出。';render();}catch(err){$('status').textContent='読み込み失敗：'+err.message;}});
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);
function csv(){return '順位,国家タグ,記録数（ゲーム内プレイ回数ではない）\r\n'+visible().map((r,i)=>[i+1,r.tag,r.count].join(',')).join('\r\n');}
$('csv').addEventListener('click',()=>{const blob=new Blob(['\ufeff'+csv()],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='hoi4-career-tags.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(csv());$('status').textContent='表をコピーしました。';}catch(e){$('status').textContent='コピーできませんでした。CSV保存を使用してください。'}});
</script></body></html>
