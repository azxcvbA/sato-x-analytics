name: Post metrics every 10 minutes
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sato-metrics-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update recent known post metrics (unofficial public data)
        env:
          SATO_ENABLE_UNOFFICIAL_REFRESH: ${{ vars.SATO_ENABLE_UNOFFICIAL_REFRESH != '0' && '1' || '0' }}
        run: python scripts/refresh.py
      - name: Record timestamped observations
        run: python scripts/record_history.py
      - name: Commit changes if any
        run: |
          git add data.json metric-history.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh post metrics and record history'
            git push
          else
            echo 'No data changes'
          fi
