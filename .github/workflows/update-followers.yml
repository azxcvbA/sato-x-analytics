name: Update X follower ranking
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
permissions:
  contents: write
concurrency:
  group: follower-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch follower data
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          MAX_PAGES: '100'
        run: python scripts/update_followers.py
      - name: Commit follower snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followers.json
          if [ -f followers-progress.json ]; then git add followers-progress.json; else git add -u followers-progress.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update X follower ranking data"
            git push
          fi
