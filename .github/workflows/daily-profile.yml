name: Daily profile counts at 23 JST
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sato-profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record public follower and following counts
        run: python scripts/record_profile.py
      - name: Save history
        run: |
          git add profile-history.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record daily profile totals'
            git pull --rebase
            git push
          fi
