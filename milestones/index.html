<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24h / 48h ランキング | さと X Analytics</title><style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans JP",sans-serif;background:#0a0e16;color:#e9eef7}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 18px 80px}a{color:#8bc8ff}h1{font-size:clamp(26px,4vw,38px)}.muted{color:#a7b6cc;line-height:1.7}.panel{border:1px solid #30425b;border-radius:14px;background:#121b29;padding:18px;margin:18px 0}.controls{display:flex;gap:15px;flex-wrap:wrap}label{display:grid;gap:7px;color:#aabed6;font-size:13px}select,button{background:#192a40;color:#edf5ff;border:1px solid #415c7a;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer}.stats{display:flex;gap:16px;flex-wrap:wrap}.stat{background:#1b2b3e;padding:12px 17px;border-radius:10px}.stat strong{font-size:24px;display:block}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:50px 1fr auto;gap:15px;align-items:center;background:#121b29;border:1px solid #30425b;border-radius:12px;padding:16px}.rank{font-size:23px;font-weight:800;color:#b2c8e7}.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.small{font-size:12px;color:#9fb2cd;margin-top:8px}.value{font-size:22px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums}.empty{padding:28px;text-align:center;color:#adc1db}@media(max-width:600px){.item{grid-template-columns:30px 1fr}.value{grid-column:2;text-align:left}main{padding:16px 12px}}</style></head><body><main>
<a href="../">← X分析サイトへ戻る</a><h1>投稿後24時間・48時間ランキング</h1><p class="muted">投稿から同じ時間が経過した時点の数値を比較します。観測値のない投稿はランキングに含めません。</p>
<section class="panel"><div class="controls"><label>比較時点<select id="hours"><option value="24">投稿24時間後</option><option value="48">投稿48時間後</option></select></label><label>ランキング指標<select id="metric"><option value="views">インプレッション</option><option value="likes">いいね</option></select></label><label>表示件数<select id="limit"><option value="20">上位20件</option><option value="50">上位50件</option><option value="all">全件</option></select></label><button id="reload">データを再取得</button></div><div class="stats" style="margin-top:18px"><div class="stat"><small>比較可能な投稿</small><strong id="available">—</strong></div><div class="stat"><small>未取得</small><strong id="missing">—</strong></div></div></section>
<p id="status" class="muted" role="status">読み込み中…</p><section id="list" class="list"></section>
<p class="muted">記録元：公開投稿データと時刻付き観測履歴。基準時刻から±90分以内の実測値のうち最も近いものを採用します。観測時刻と基準時刻との差を各投稿に表示します。欠測値を推測で補間しません。GitHub Actionsや非公式取得元の停止・遅延によって欠測する場合があります。過去の投稿についても履歴がない時点の数値は復元できません。</p></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),num=n=>Number(n).toLocaleString('ja-JP');let data=null;function render(){if(!data)return;const hours=$('hours').value,metric=$('metric').value;const available=data.posts.filter(p=>p.milestones?.[hours]&&typeof p.milestones[hours][metric]==='number').sort((a,b)=>b.milestones[hours][metric]-a.milestones[hours][metric]);$('available').textContent=num(available.length);$('missing').textContent=num(data.posts.length-available.length);const limit=$('limit').value;const items=limit==='all'?available:available.slice(0,Number(limit));const list=$('list');list.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='この条件で比較できる観測値はまだありません。';list.append(empty);return}for(let i=0;i<items.length;i++){const p=items[i],m=p.milestones[hours],row=document.createElement('article');row.className='item';const rank=document.createElement('div');rank.className='rank';rank.textContent=i+1;const body=document.createElement('div'),link=document.createElement('a');link.href=p.url||'https://x.com/sattoa_ball/status/'+encodeURIComponent(p.id);link.target='_blank';link.rel='noopener noreferrer';link.className='content';link.textContent=p.text||'(本文なし)';const note=document.createElement('div');note.className='small';const offset=m.offset_minutes;note.textContent='実測：'+new Date(m.observed_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+'（基準から '+(offset>=0?'+':'')+offset+' 分）';body.append(link,note);const value=document.createElement('div');value.className='value';value.textContent=num(m[metric]);row.append(rank,body,value);list.append(row)}}async function load(){try{const response=await fetch('../milestone-metrics.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('データ未生成または読み込み失敗');data=await response.json();render();$('status').textContent='取得済みの観測データからランキングを作成しました。'}catch(e){$('status').textContent='読み込みエラー：'+e.message}}for(const id of ['hours','metric','limit'])$(id).addEventListener('change',render);$('reload').addEventListener('click',load);load()})();</script></body></html>
