<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国共産党・中華人民共和国 歴代政治家Tier表</title><style>
:root{font-family:system-ui,"Yu Gothic",sans-serif;color-scheme:dark;background:#0d121b;color:#e9f0fa}*{box-sizing:border-box}body{margin:0}header{background:#182233;border-bottom:1px solid #34445b;padding:22px max(16px,calc((100vw - 1200px)/2))}h1{margin:6px 0;font-size:clamp(22px,3vw,34px)}p{color:#a9bad0}main{max-width:1200px;margin:auto;padding:18px 14px 70px}a{color:#91c8ff}button,select,input{font:inherit;background:#253348;color:#e9f0fa;border:1px solid #4b5e77;border-radius:7px;padding:9px;cursor:pointer}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.tier{display:grid;grid-template-columns:90px minmax(0,1fr);border:1px solid #36485e;border-bottom:0;min-height:98px}.tier:last-child{border-bottom:1px solid #36485e}.name{display:grid;place-items:center;color:#151515;font-weight:900;font-size:27px}.zone{display:flex;align-content:start;align-items:start;flex-wrap:wrap;gap:7px;padding:9px;min-height:96px;background:#151e2b}.zone.over{background:#253d54}.tile{width:105px;min-height:67px;border:1px solid #52657b;border-radius:7px;background:#25364c;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;cursor:grab;text-align:center;touch-action:manipulation}.tile b{font-size:16px}.tile small{color:#b6c9df;font-size:10px;margin-top:4px}.tile.selected{outline:3px solid #f8d875}.pool{margin-top:22px}.pool .zone{border:1px solid #42536a;border-radius:8px;min-height:120px}.hint{font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.count{color:#9fb2c9;font-size:13px}.group{margin-top:10px}input[type=search]{min-width:240px}footer{color:#9fb2c9;font-size:12px;margin-top:20px}@media(max-width:650px){.tier{grid-template-columns:52px minmax(0,1fr)}.name{font-size:20px}.tile{width:86px;min-height:58px}.tile b{font-size:13px}}
</style></head><body><header><a href="../">← X Analytics に戻る</a><h1>中国共産党・中華人民共和国<br>歴代政治家Tier表</h1><p>対象：1921〜2026年｜最高指導者・国家主席・主要党幹部・政治家。初期順位は未設定。</p></header><main>
<div class="toolbar"><button id="reset">配置をリセット</button><button id="export">JSONを保存</button><button id="import">JSONを読み込む</button><input id="file" type="file" accept=".json,application/json" hidden><button id="add">人物を追加</button><button id="remove">選択人物を削除</button></div>
<p class="hint">人物カードをドラッグしてTierへ移動。スマホでは人物をタップしてから移動先のTierをタップ。評価は自分で決定できます。</p><div id="board"></div>
<section class="pool"><h2>未評価の人物 <span id="remaining" class="count"></span></h2><div class="actions"><input id="search" type="search" placeholder="人物名・区分で絞り込み"><select id="filter"><option value="">すべての区分</option></select><button id="clear">絞り込み解除</button></div><div id="pool" class="zone" data-zone="pool"></div></section>
<footer>人物は編集用の候補であり、Tier配置は初期状態で空欄です。ブラウザ内に自動保存します。役職と活動時期の区分は簡易的な分類です。</footer></main>
<script>
const initial=[["陳独秀","創設期"],["李大釗","創設期"],["瞿秋白","創設期"],["向忠発","創設期"],["王明","革命期"],["博古","革命期"],["張国燾","革命期"],["毛沢東","革命期・建国後"],["朱徳","革命期・建国後"],["周恩来","革命期・建国後"],["劉少奇","革命期・建国後"],["任弼時","革命期"],["彭徳懐","革命期・建国後"],["林彪","革命期・建国後"],["董必武","国家主席"],["宋慶齢","国家主席"],["華国鋒","改革移行期"],["鄧小平","改革開放期"],["胡耀邦","改革開放期"],["趙紫陽","改革開放期"],["李先念","国家主席"],["楊尚昆","国家主席"],["陳雲","改革開放期"],["江沢民","改革開放期"],["李鵬","国務院総理"],["朱鎔基","国務院総理"],["胡錦濤","現代"],["温家宝","国務院総理"],["習近平","現代"],["李克強","国務院総理"],["李強","国務院総理"]];
const levels=[["S","#ff7777"],["A","#ffaf70"],["B","#f5dc79"],["C","#a5d990"],["D","#83bfea"],["E","#a9a6d6"]];
const key="sato-china-tier-1921-2026-v1";
let state;try{state=JSON.parse(localStorage.getItem(key))}catch{};if(!state||!Array.isArray(state.people))state={people:initial.map((p,i)=>({id:i+1,name:p[0],group:p[1],zone:"pool"}))};
let selected=null;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(key,JSON.stringify(state));
function move(id,zone){const p=state.people.find(x=>x.id===id);if(p){p.zone=zone;selected=null;save();render()}}
function card(p){let d=document.createElement("div");d.className="tile"+(selected===p.id?" selected":"");d.draggable=true;d.dataset.id=p.id;d.innerHTML="<b></b><small></small>";d.querySelector("b").textContent=p.name;d.querySelector("small").textContent=p.group;d.title=p.name+"：クリックで選択";d.onclick=e=>{e.stopPropagation();selected=selected===p.id?null:p.id;render()};d.ondragstart=e=>{e.dataTransfer.setData("text/plain",String(p.id));e.dataTransfer.effectAllowed="move"};return d}
function wire(zone){zone.ondragover=e=>{e.preventDefault();zone.classList.add("over")};zone.ondragleave=()=>zone.classList.remove("over");zone.ondrop=e=>{e.preventDefault();zone.classList.remove("over");move(Number(e.dataTransfer.getData("text/plain")),zone.dataset.zone)};zone.onclick=()=>{if(selected!==null)move(selected,zone.dataset.zone)}}
function render(){const board=$("board");board.replaceChildren();levels.forEach(([label,color])=>{const row=document.createElement("div");row.className="tier";const n=document.createElement("div");n.className="name";n.textContent=label;n.style.background=color;const z=document.createElement("div");z.className="zone";z.dataset.zone=label;wire(z);state.people.filter(p=>p.zone===label).forEach(p=>z.appendChild(card(p)));row.append(n,z);board.append(row)});
const search=$("search").value.toLowerCase(),filter=$("filter").value;const pool=$("pool");pool.replaceChildren();wire(pool);state.people.filter(p=>p.zone==="pool"&&(!search||(p.name+" "+p.group).toLowerCase().includes(search))&&(!filter||p.group===filter)).forEach(p=>pool.appendChild(card(p)));$("remaining").textContent="("+state.people.filter(p=>p.zone==="pool").length+"人 / 全"+state.people.length+"人)";}
const groups=[...new Set(initial.map(x=>x[1]))];groups.forEach(g=>{const o=document.createElement("option");o.value=g;o.textContent=g;$("filter").append(o)});
$("search").oninput=render;$("filter").onchange=render;$("clear").onclick=()=>{$("search").value="";$("filter").value="";render()};
$("reset").onclick=()=>{if(confirm("すべての人物を未評価に戻しますか？")){state.people.forEach(p=>p.zone="pool");save();render()}};
$("add").onclick=()=>{const name=prompt("追加する人物名");if(!name||!name.trim())return;const group=prompt("区分（任意）","追加人物")||"追加人物";state.people.push({id:Math.max(0,...state.people.map(x=>x.id))+1,name:name.trim(),group,zone:"pool"});save();render()};
$("remove").onclick=()=>{if(selected===null){alert("削除する人物を選択してください");return}const p=state.people.find(x=>x.id===selected);if(p&&confirm(p.name+" を削除しますか？")){state.people=state.people.filter(x=>x.id!==selected);selected=null;save();render()}};
$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="china-leaders-tier.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v.people)||!v.people.every(p=>typeof p.name==="string"&&typeof p.zone==="string"))throw Error("形式が違います");state=v;save();render()}catch(err){alert("読み込み失敗："+err.message)}e.target.value=""};
render();
</script></body></html>
